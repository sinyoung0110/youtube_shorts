<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #101827;
        --ink: #f8fafc;
        --muted: #a8b8cd;
        --cyan: #65d6c4;
        --gold: #f4c95d;
        --green: #36d399;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      body { color: var(--ink); font-family: Inter, "Noto Sans JP", sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(ellipse at 50% 34%, #253b5b 0%, var(--ground) 53%, #080d15 100%); }
      .clip { position: absolute; }
      #kicker { left: 90px; top: 205px; width: 900px; color: var(--cyan); font-size: 34px; font-weight: 700; letter-spacing: 0.12em; text-align: center; }
      #hook { left: 95px; top: 360px; width: 890px; font-size: 88px; font-weight: 800; line-height: 1.12; text-align: center; }
      #goal { color: var(--gold); }
      #array-label { left: 90px; top: 495px; width: 900px; color: var(--muted); font-size: 36px; text-align: center; }
      #array { left: 105px; top: 605px; width: 870px; display: flex; justify-content: center; gap: 8px; }
      .number { width: 88px; height: 150px; border: 3px solid #6b91d8; border-radius: 18px; background: #6b91d822; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 17px; }
      .value { font-size: 42px; font-weight: 800; }
      .index { color: var(--muted); font-size: 20px; }
      #instruction { left: 86px; top: 895px; width: 908px; min-height: 170px; text-align: center; }
      .line { position: absolute; left: 0; width: 100%; font-size: 47px; line-height: 1.22; font-weight: 750; }
      .line.small { font-size: 38px; }
      .gold { color: var(--gold); }
      .green { color: var(--green); }
      #complexity { left: 80px; top: 1110px; width: 920px; text-align: center; }
      #complexity-title { font-size: 60px; color: var(--gold); font-weight: 800; }
      #complexity-copy { margin-top: 24px; font-size: 34px; line-height: 1.3; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="33">
      <div id="scene" data-composition-id="scene" data-composition-src="compositions/binary-search.html" data-start="0" data-duration="33" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
